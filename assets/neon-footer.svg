<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="title">
  <title id="title">Build, play, iterate</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#130526"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00E5FF"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="0.8" stop-color="#FF2BD6"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="110" rx="22"/></clipPath>
  </defs>
  <rect width="1200" height="110" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <path d="M0 77 C150 28 280 103 420 60 S710 24 835 66 S1070 102 1200 42" fill="none" stroke="url(#line)" stroke-width="2" opacity="0.65">
      <animate attributeName="d" values="M0 77 C150 28 280 103 420 60 S710 24 835 66 S1070 102 1200 42;M0 48 C150 96 280 22 420 65 S710 102 835 58 S1070 25 1200 71;M0 77 C150 28 280 103 420 60 S710 24 835 66 S1070 102 1200 42" dur="9s" repeatCount="indefinite"/>
    </path>
    <rect x="-240" y="13" width="180" height="84" fill="url(#line)" opacity="0.1" transform="skewX(-20)">
      <animate attributeName="x" values="-240;1400" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <line x1="120" y1="55" x2="1080" y2="55" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
  <rect x="436" y="30" width="328" height="50" rx="25" fill="#0B1020" stroke="#8B5CF6" stroke-opacity="0.55"/>
  <text x="600" y="62" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="4">BUILD • PLAY • ITERATE</text>
</svg>
