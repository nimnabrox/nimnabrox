<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-labelledby="title">
  <title id="title">Animated neon divider</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#2979FF"/>
      <stop offset="0.72" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-500%" width="140%" height="1100%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="40" y1="17" x2="1160" y2="17" stroke="url(#line)" stroke-width="1" opacity="0.6"/>
  <rect x="-180" y="14" width="180" height="6" rx="3" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="x" values="-180;1200" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="17" r="3" fill="#F8FAFC" filter="url(#glow)">
    <animate attributeName="r" values="2;4;2" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
